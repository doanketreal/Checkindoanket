<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkin Đoàn Kết - Đăng nhập</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container auth-page">
      <h1>Checkin Đoàn Kết</h1>
      <p class="subtitle">Tạo tài khoản, đăng nhập và mở cửa sổ chấm công.</p>

      <section class="card">
        <div class="auth-layout">
          <div class="auth-box">
            <h2>Đăng ký</h2>
            <div class="grid single-col">
              <label>
                Họ và tên
                <input id="registerFullName" type="text" placeholder="Ví dụ: Nguyễn Văn A" />
              </label>
              <label>
                Username
                <input id="registerUsername" type="text" placeholder="Ví dụ: nguyenvana" />
              </label>
              <label>
                Giới tính
                <select id="registerGender">
                  <option value="male">Nam</option>
                  <option value="female">Nữ</option>
                </select>
              </label>
              <label>
                Mật khẩu
                <input id="registerPassword" type="password" placeholder="Tối thiểu 6 ký tự" />
              </label>
            </div>
            <div class="actions">
              <button id="registerBtn" class="btn primary">Đăng ký</button>
            </div>
            <p class="hint">Tài khoản đầu tiên sẽ được cấp quyền quản trị (admin).</p>
          </div>

          <div class="auth-box">
            <h2>Đăng nhập</h2>
            <div class="grid single-col">
              <label>
                Username
                <input id="loginUsername" type="text" placeholder="Nhập username" />
              </label>
              <label>
                Mật khẩu
                <input id="loginPassword" type="password" placeholder="Nhập mật khẩu" />
              </label>
            </div>
            <div class="actions">
              <button id="loginBtn" class="btn success">Đăng nhập</button>
            </div>
            <p class="hint">Sau khi đăng nhập thành công, hệ thống sẽ mở cửa sổ chấm công mới.</p>
          </div>

          <div class="auth-box">
            <h2>Quên mật khẩu</h2>
            <div class="grid single-col">
              <label>
                Username
                <input id="resetUsername" type="text" placeholder="Nhập username cần đổi mật khẩu" />
              </label>
              <label>
                Mã đặt lại
                <input id="resetCode" type="text" placeholder="Nhập mã: doanketreal" />
              </label>
              <label>
                Mật khẩu mới
                <input id="resetNewPassword" type="password" placeholder="Nhập mật khẩu mới" />
              </label>
            </div>
            <div class="actions">
              <button id="resetPasswordBtn" class="btn warning">Đổi mật khẩu</button>
            </div>
          </div>
        </div>

        <p id="authStatus" class="status">Chưa đăng nhập.</p>
      </section>
    </main>

    <script src="/auth.js"></script>
  </body>
</html>
