<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkin Đoàn Kết - Bảng chấm công</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="card header-card">
        <div>
          <h1>Bảng chấm công</h1>
          <p id="userLabel" class="subtitle"></p>
        </div>
        <div class="actions compact">
          <button id="refreshBtn" class="btn ghost">Làm mới</button>
          <button id="logoutBtn" class="btn danger">Đăng xuất</button>
        </div>
      </header>

      <section class="card">
        <div class="tabs">
          <button id="tabCalendar" class="tab active">Tab 1: Lịch chấm công</button>
          <button id="tabHistory" class="tab">Tab 2: Danh sách đã chấm</button>
        </div>

        <div id="calendarPanel" class="tab-panel active">
          <div class="calendar-toolbar">
            <button id="prevMonthBtn" class="btn ghost">Tháng trước</button>
            <h2 id="monthLabel"></h2>
            <button id="nextMonthBtn" class="btn ghost">Tháng sau</button>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>

          <div class="actions">
            <button id="markAttendanceBtn" class="btn success" disabled>Chấm công ngày đã chọn</button>
            <button id="deleteAttendanceBtn" class="btn warning" disabled>Xoá chấm công ngày đã chọn</button>
          </div>
        </div>

        <div id="historyPanel" class="tab-panel">
          <div class="section-header">
            <h2>Danh sách đã chấm</h2>
            <input id="historyDateFilter" type="date" />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Ngày</th>
                  <th>Họ tên</th>
                  <th>Username</th>
                  <th>Thời gian chấm</th>
                  <th>IP</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="historyBody"></tbody>
            </table>
          </div>
        </div>

        <p id="status" class="status">Sẵn sàng.</p>
      </section>
    </main>

    <script src="/dashboard.js"></script>
  </body>
</html>
